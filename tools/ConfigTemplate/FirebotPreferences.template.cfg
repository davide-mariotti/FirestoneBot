[firebot_settings]
# Determines if the bot logic should be initialized and started automatically upon game launch.
auto_start = true
# The initial cooldown (in seconds) before the bot begins execution.Clamped between 10.0 and 120.0 seconds.
start_bot_delay = 10.0
# The interval (in seconds) between each BotManager verification cycle.Clamped between 5.0 and 3600.0 seconds.
scan_interval = 5.0
# The delay (in seconds) between individual UI interactions (clicks, transitions).Clamped between 0.5 and 5.0 seconds.
interaction_delay = 1.0
# Maximum time (in seconds) a single task is allowed to run before it is aborted.Clamped between 10.0 and 3600.0 seconds.
max_task_runtime = 120.0
# Enables verbose logging and StackTrace display in the console for easier bug identification.
debug_mode = true
# The physical key used to manually toggle the bot's execution state during gameplay.
shortcut_key = "F7"
# Some timers in the game can be sped up for free if the remaining time is below this threshold (default: 170 seconds = 2 minutes and 50 seconds). The maximum allowed value is 180 seconds (3 minutes). Set to 0 to disable free speedup. Adjust this value to account for lag or future game changes. Affects firestone researches, missions, experiments, and map reset timers. If the remaining time is less than or equal to this value, the speedup is free (no gems required).
free_speedup_seconds = 170.0
# When enabled, caps the game's frame rate and forces the lowest graphics quality level at startup. The bot reads game state directly from the Unity scene hierarchy, not from rendered pixels, so visual quality/frame rate have no effect on bot functionality - only on CPU/GPU load. Recommended when running several simultaneous instances on the same machine.
low_resource_mode = true
# Frame rate cap applied when low_resource_mode is enabled. Clamped between 5 and 60. Default: 15.
target_frame_rate = 15
# Unity quality level index applied when low_resource_mode is enabled (0 = lowest/fastest). Clamped between 0 and 5. Default: 0.
render_quality_level = 0
# The game window's client-area width applied when low_resource_mode is enabled. Default: 640 (matches the previous fixed size). Only change this together with window_height if you also enable window_grid_enabled below - there's no reason to want a bigger window while low_resource_mode is on otherwise.
window_width = 504
# The game window's client-area height applied when low_resource_mode is enabled. Default: 480 (matches the previous fixed size). See window_width.
window_height = 316
# When enabled (and low_resource_mode is also on), moves this instance's window to a fixed position in a grid on the primary monitor, so multiple simultaneous instances can all be visible at once without manual dragging. Which cell this instance uses is derived from the 'Steam-N' number in its own install path (Steam-0, Steam-1, ...), filling the grid left-to-right then top-to-bottom.
window_grid_enabled = true
# How many instances per row when window_grid_enabled is on. Default: 5 - pair with window_width=504/window_height=316 for a 5x4 grid of up to 20 instances on a 2560x1440 monitor: each window's visible frame is then 506x348 (the grid adds the title bar and border on top of these client sizes), so 4 rows end exactly at the taskbar (1392px) and 5 columns leave ~30px free on the right, with no overlap.
window_grid_columns = 5
# The 'Steam-N' number that takes the top-left grid cell when window_grid_enabled is on; higher numbers fill the following cells. Default: 0 (Steam-0 is top-left). Set it to the lowest instance number on this machine when a PC hosts a range that doesn't start at 0 (e.g. 17 for Steam-17..34) - otherwise the grid starts from an empty row far off-screen.
# PC PRINCIPALE (Steam-0..16): 0
# SECONDO PC (Steam-17..34): 17
window_grid_first_instance = 0

