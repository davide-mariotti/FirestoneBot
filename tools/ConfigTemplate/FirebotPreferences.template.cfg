# Minimum time (in minutes) that must have passed in the current adventure before the bot considers empowering, even if the ratio above is already met. Default: 0 (disabled - only the ratio decides).
min_adventure_minutes = 60
# Once the current adventure has run for this many minutes, the bot empowers regardless of the ratio above. Set to 0 to disable (only the ratio decides). Default: 0 - a time-based override would empower below the ratio, which the F2P guide rules out.
max_adventure_minutes = 360
