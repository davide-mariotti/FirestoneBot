[experimentstask]
# - - - - - - - - - - - - - - - - - - - - - - - - - -
enabled = true
# ALCHEMIST EXPERIMENT RESOURCE CONFIGURATION.
# This setting controls which experiment resources are SPENT on starting experiments.
# Valid IDs: 0=Dragon blood, 1=Strange dust, 2=Exotic coin.
# Enter comma-separated IDs (e.g. '0,1,2').
# Any value other than 0, 1, or 2 will be ignored. Set to empty to never start an experiment at all (claiming finished ones is free and happens regardless).
# Default: '0' (Dragon blood only) - per the F2P guide, Dragon blood is the one currency that belongs in experiments, and it comes back from the map's dragon missions.
# DO NOT ADD 1 (Strange dust): the guide lists spending it here among the mistakes to avoid - it's needed for tier 2 soul stones (1.000 per hero) and Guardian evolutions, and an experiment gives a random result of which only about a third of the possible bonuses are useful.
# EXAMPLES: '0' = Dragon blood only (recommended). '0,2' = Dragon blood and Exotic coin.
resource_type = "0"
# (auto-managed, don't edit)
next_run_time_internal = ""

